# Replicate stumpy-dev/automate "Numba Release Candidate Check"
# (https://github.com/stumpy-dev/automate/blob/main/.github/workflows/numba-release-candidate-actions.yml)
#
# Differences from automate:
# - Pins the requested numba/llvmlite versions instead of `grep rc | tail -n 1`
#   (that pairing independently picks the latest RC of each package and often
#   conflicts, e.g. numba 0.67.0rc1 + llvmlite 0.50.0rc3).
# - Always checks out stumpy-dev/stumpy (automate's checkout `if` is leftover
#   from the compatibility workflow; it happens to pass when both sides are empty).
# - Default Python is automate's "safe" version: n-2 of non-EOL CPython
#   (currently 3.13; see stumpy versions.py `-mode safe`).
name: STUMPY vs Numba RC Check

on:
  workflow_dispatch:
    inputs:
      numba_version:
        description: Numba version to install from PyPI
        required: true
        default: "0.68.0rc1"
      llvmlite_version:
        description: llvmlite version to install from PyPI
        required: true
        default: "0.50.0rc3"
      python_version:
        description: Python version (automate "safe" is currently 3.13)
        required: true
        default: "3.13"

permissions:
  contents: read

jobs:
  check_stumpy:
    runs-on: ubuntu-latest
    steps:
      - name: Set Up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ inputs.python_version }}

      - name: Display Python Version
        run: python -c "import sys; print(sys.version)"

      - name: Install Release Candidate Requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade \
            "numba==${{ inputs.numba_version }}" \
            "llvmlite==${{ inputs.llvmlite_version }}"

      - name: Checkout STUMPY
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: stumpy-dev/stumpy
          persist-credentials: false

      - name: Install STUMPY And Other Dependencies
        run: python -m pip install --editable ".[ci]"

      - name: Show versions
        run: |
          python -c "import sys, numba, llvmlite, numpy, scipy, stumpy; \
            print(sys.version.split()[0]); \
            print('numba', numba.__version__); \
            print('llvmlite', llvmlite.__version__); \
            print('numpy', numpy.__version__); \
            print('scipy', scipy.__version__); \
            print('stumpy', stumpy.__version__)"
          python -m numba -s

      - name: Run Unit Tests
        run: ./test.sh unit
